<!DOCTYPE html>

<title>YADIRIS TV</title>
<style>
body{background:#141414;color:#fff;margin:0;font-family: 'Helvetica', Arial}
.header{background:#000;padding:15px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.logo{color:#E50914;font-size:28px;font-weight:900;letter-spacing:1px}
.user{width:30px;height:30px;background:#E50914;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:bold}
.banner{background:linear-gradient(to top, #141414 0%, transparent 50%), url('https://images.unsplash.com/photo-1485846234645-a62644f84728?w=600');background-size:cover;background-position:center;height:250px;display:flex;align-items:flex-end;padding:20px}
.banner h1{font-size:32px;margin:0;text-shadow:2px 2px 4px #000}
.banner p{color:#999;font-size:14px;margin:5px 0}
.btn-play{background:#fff;color:#000;padding:8px 20px;border-radius:4px;font-weight:bold;border:none;margin-top:10px}
.btn-play:active{background:#ccc}
.titulo{padding:15px 15px 5px 15px;font-size:18px;font-weight:bold}
.fila{display:flex;gap:10px;overflow-x:auto;padding:10px 15px;scrollbar-width:none}
.fila::-webkit-scrollbar{display:none}
.card-netflix{min-width:120px;height:170px;background:#222;border-radius:6px;position:relative;overflow:hidden;flex-shrink:0;border:1px solid #333}
.card-netflix img{width:100%;height:100%;object-fit:cover}
.card-netflix .nombre{position:absolute;bottom:0;background:linear-gradient(transparent, black);width:100%;padding:30px 8px 8px 8px;font-size:12px;font-weight:bold;box-sizing:border-box}
.card-netflix:active{transform:scale(0.95);border-color:#E50914}
</style>
</head>
